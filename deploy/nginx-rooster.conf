# Rooster Reminder — nginx reverse proxy (HTTP bootstrap).
# After ICP备案 + DNS: run `certbot --nginx -d your.domain.com` which rewrites
# this file to add the 443 server block and an 80 -> 443 redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 2m;

    # API + same-origin H5 preview + shared sound assets.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 7d;
    }
    location /preview/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location / { return 404; }
}